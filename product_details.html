    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap"

            font-family: 'Cairo', sans-serif;
            background: #f0f2f5;
            direction: rtl;
            height: 100vh;
            overflow: hidden;
        }
        .split-layout {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .left-side {
            width: 35%;
            background: white;
            box-shadow: 4px 0 12px rgba(0,0,0,0.05);
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

            width: 65%;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;

            max-height: 95%;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);

        .general-flyer h4 {

            color: #00539F;

        }

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0 20px;
            justify-content: center;
        }

            min-width: 70px;
            padding: 8px 5px;
            border: none;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            color: white;

        .btn-info { background: #17a2b8; }
        .btn-danger { background: #DC3545; }

        .btn-favorite { background: #dc3545; color: white; }

        .btn:hover { opacity: 0.85; transform: translateY(-2px); }
        
        .product-info {
            flex: 1;

        .title-row {

            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;

        .product-title {
            font-size: 2rem;
            font-weight: 800;
            color: #00539F;

        }
        .supermarket-name {
            font-size: 1.6rem;
            color: #FF6B00;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .price-box {
            background: #e9ecef;
            border-radius: 16px;
            padding: 12px 15px;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;

        .current-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #00539F;

            font-size: 1rem;

        .discount-badge {

            color: white;
            padding: 5px 12px;
            border-radius: 30px;

            font-size: 1rem;

            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .detail-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 14px;
        }
        .detail-label {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 5px;
        }
        .detail-value {
            font-weight: 800;
            color: #222;
            font-size: 1.05rem;
            line-height: 1.4;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 20px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .modal img {

            max-height: 95%;
            object-fit: contain;
            border-radius: 8px;
        }
        .modal .close {

            top: 20px;
            left: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: rgba(0,0,0,0.6);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .split-layout {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .left-side, .right-side {
                width: 100%;
            }
            .right-side {
                min-height: 35vh;
                max-height: 35vh;
                order: -1;
            }
            .right-side img {
                max-height: 100%;
                width: auto;
                cursor: pointer;
            }
            .left-side {
                order: 0;
                overflow-y: auto;
                padding: 12px;
            }
            .title-row {
                order: -1;
                margin-top: 0;
                margin-bottom: 6px;
                justify-content: center;
            }
            .product-title {
                font-size: 1rem;
            }
            .supermarket-name {
                font-size: 0.85rem;
            }
            .actions-row {
                order: 0;
                margin: 6px 0 10px;
                gap: 6px;
            }
            .actions-row .btn {
                flex: 1 0 calc(33% - 6px);
                font-size: 0.7rem;
                padding: 5px 3px;
            }
            .price-box {
                margin: 8px 0;
                padding: 6px 10px;
            }
            .current-price {
                font-size: 1.3rem;
            }
            .details-grid {
                gap: 8px;
                margin: 10px 0;
            }
            .detail-item {
                padding: 6px 8px;
            }
            .detail-value {
                font-size: 0.85rem;
            }
            .general-flyer {
                margin-bottom: 12px;
                padding: 10px;
            }
            .general-flyer img {
                max-height: 120px;
            }
            .back-btn {
                padding: 10px;
                margin-top: 12px;
            }

    </style>

  <body>
    <div class="split-layout" id="mainContainer">
      <div class="loading">جارٍ تحميل البيانات...</div>
    </div>
    <div id="imageModal" class="modal" onclick="closeModal()">
      <div class="close">×</div>
      <img id="modalImage" src="" alt="صورة مكبرة"> </div>
    <script>
    let productData = null;
    let supermarketData = {};

    // القيم الافتراضية (لن تستخدم إلا إذا فشل تحميل ملف السوبرماركت)
    const defaultSupermarketInfo = {
        phone: "غير متوفر",
        website: "#",
        map_link: "#"
    };

function cropImageWithCanvas(item) {
    return new Promise((resolve, reject) => {
        // 1. الحصول على رابط الفلاير الكامل
        const fullImageUrl = getProductImageUrl(item);
        if (!fullImageUrl) {
            reject('No image URL');
            return;
        }

        // 2. استخراج الإحداثيات (نفس القيم من الإكسل)
        const x = parseFloat(item.X) || 0;
        const y = parseFloat(item.Y) || 0;
        const w = parseFloat(item['العرض']) || 0;
        const h = parseFloat(item['الارتفاع']) || 0;

        // إذا لم توجد إحداثيات، نرفض
        if (x === 0 && y === 0 && w === 0 && h === 0) {
            reject('No coordinates');
            return;
        }

        // 3. تحميل الصورة في كائن Image
        const img = new Image();
        img.crossOrigin = 'anonymous'; // مهم لتجنب مشاكل CORS

        img.onload = function() {
            try {
                const img_w = img.width;
                const img_h = img.height;

                // تحويل النسب المئوية إلى بكسلات (نفس منطق البايثون)
                const left_px = x <= 1.0 ? x * img_w : x;
                const top_px = y <= 1.0 ? y * img_h : y;
                const box_w_px = w <= 1.0 ? w * img_w : w;
                const box_h_px = h <= 1.0 ? h * img_h : h;

                // إعدادات القص (نفس قيم PAD من البايثون)
                const PAD_LEFT_PCT = 0.40;
                const PAD_RIGHT_PCT = 0.11;
                const PAD_TOP_PCT = 0.17;
                const PAD_BOTTOM_PCT = 0.05;

                // حساب الإحداثيات النهائية مع الهوامش
                let final_left = Math.max(0, left_px - (img_w * PAD_LEFT_PCT));
                let final_right = Math.min(img_w, left_px + box_w_px + (img_w * PAD_RIGHT_PCT));
                let final_top = Math.max(0, top_px - (img_h * PAD_TOP_PCT));
                let final_bottom = Math.min(img_h, top_px + box_h_px + (img_h * PAD_BOTTOM_PCT));

                const crop_w = final_right - final_left;
                const crop_h = final_bottom - final_top;

                if (crop_w <= 0 || crop_h <= 0) {
                    reject('Invalid crop dimensions');
                    return;
                }

                // 4. رسم الجزء المقتطع على Canvas
                const canvas = document.createElement('canvas');
                canvas.width = crop_w;
                canvas.height = crop_h;
                const ctx = canvas.getContext('2d');

                // رسم الصورة الأصلية مع اقتصاصها مباشرة (source x, source y, source w, source h)
                ctx.drawImage(img, final_left, final_top, crop_w, crop_h, 0, 0, crop_w, crop_h);

                // تحويل Canvas إلى رابط صورة (Data URL)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                resolve(dataUrl);
            } catch (err) {
                reject(err);
            }
        };

        img.onerror = function() {
            reject('Failed to load image');
        };

        // بدء تحميل الصورة
        img.src = fullImageUrl;
    });
}
      
      
      
      
function loadProductFromSession() {
    const stored = sessionStorage.getItem('selectedProduct');
    if (!stored) {
        showError('لم يتم العثور على بيانات المنتج.');
        return false;
    }
    try {
        productData = JSON.parse(stored);
        
        // ✅ التأكد من وجود الحقول الأساسية
        if (!productData.product || productData.product.trim() === '') {
            showError('بيانات المنتج غير مكتملة (اسم المنتج مفقود)');
            return false;
        }
        if (!productData.supermarket) productData.supermarket = 'غير معروف';
        if (!productData.solution_key) productData.solution_key = productData.product || 'unknown';
        if (!productData.currency) productData.currency = 'EGP';
        if (!productData._discount_pct) productData._discount_pct = productData.discount || 0;
        if (!productData.originalPrice) productData.originalPrice = 0;
        if (!productData.validUntil) productData.validUntil = 'غير متاح';
        if (!productData.updateDate) productData.updateDate = null;
        if (!productData.primaryName) productData.primaryName = '';
        if (!productData.unit) productData.unit = '';
        if (!productData.category) productData.category = '';
        if (!productData.brand) productData.brand = '';
        
        return true;
    } catch(e) {
        console.error('خطأ في تحليل بيانات المنتج', e);
        showError('خطأ في قراءة بيانات المنتج');
        return false;
    }
}

async function loadSupermarketData() {
    try {
        const response = await fetch('supermarkets.xlsx');
        if (!response.ok) {
            console.warn('لم يتم العثور على ملف supermarkets.xlsx');
            return;
        }
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        rows.forEach(row => {
            let name = row['supermarket_name'] || row['اسم السوبر ماركت'] || row['اسم السوبرماركت'];
            if (!name) return;

            // تحويل القيم إلى نصوص مع تنظيف المسافات
            let phoneRaw = row['phone'] || row['hotline'] || row['هاتف'] || row['phone/hotline'] || '';
            let phone = String(phoneRaw).trim();
            if (phone === '' || phone === 'undefined' || phone === 'null') phone = 'غير متوفر';
            
            let websiteRaw = row['website'] || row['موقع'] || row['الموقع الالكتروني'] || '';
            let website = String(websiteRaw).trim();
            if (website === '' || website === 'undefined' || website === 'null' || website === '-') website = '#';
            
            let mapLinkRaw = row['map_link'] || row['رابط الخريطة'] || '';
            let map_link = String(mapLinkRaw).trim();
            if (map_link === '' || map_link === 'undefined' || map_link === 'null' || map_link === '-') map_link = '#';

            supermarketData[name] = { phone, website, map_link };
        });
        console.log('تم تحميل بيانات السوبرماركت', Object.keys(supermarketData).length);
    } catch(err) {
        console.warn('فشل تحميل بيانات السوبرماركت', err);
    }
}
      

    function getProductImageUrl(item) {
        let flyerId = item.pageNo?.match(/flyer_(\d+)/)?.[1] || item.solution_key;
        let pageNumber = item.pageNo?.match(/page_(\d+)/)?.[1] || '';
        if (flyerId && pageNumber) return `https://www.mobappsbaker.com/catalogs/thwr/offers/${flyerId}/${pageNumber}.jpg`;
        return null;
    }

    function getGeneralFlyerUrl(item) {
        let flyerId = item.pageNo?.match(/flyer_(\d+)/)?.[1] || item.solution_key;
        if (flyerId) return `https://www.mobappsbaker.com/catalogs/thwr/offers/${flyerId}/1.jpg`;
        return null;
    }

    // وظائف المفضلة والمشاركة
    window.shareProduct = function() {
        if (!productData) return;
        const text = `${productData.product} - بسعر ${productData.currentPrice} جنيه - ${productData.supermarket}`;
        if (navigator.share) navigator.share({ title: productData.product, text: text });
        else navigator.clipboard.writeText(text + ' ' + window.location.href) && alert('تم نسخ الرابط');
    };

    window.toggleFavorite = function() {
        if (!productData) return;
        let favorites = JSON.parse(localStorage.getItem('product_favorites') || '[]');
        const exists = favorites.some(f => f.solution_key === productData.solution_key);
        if (exists) favorites = favorites.filter(f => f.solution_key !== productData.solution_key);
        else favorites.push({ solution_key: productData.solution_key, product: productData.product, supermarket: productData.supermarket, currentPrice: productData.currentPrice, imageUrl: getProductImageUrl(productData) });
        localStorage.setItem('product_favorites', JSON.stringify(favorites));
        updateFavoriteButtonStatus();
        showToast(exists ? 'تم الإزالة' : 'تم الإضافة');
    };

    function updateFavoriteButtonStatus() {
        if (!productData) return;
        const favorites = JSON.parse(localStorage.getItem('product_favorites') || '[]');
        const exists = favorites.some(f => f.solution_key === productData.solution_key);
        const btn = document.getElementById('favoriteBtn');
        if (btn) {
            btn.classList.toggle('active', exists);
            btn.innerHTML = exists ? '<i class="fas fa-heart"></i> مفضل' : '<i class="fas fa-heart"></i> تفضيل';
        }
    }

    function showToast(msg) {
        let toast = document.createElement('div');
        toast.textContent = msg;
        toast.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:white; padding:8px 20px; border-radius:30px; z-index:1000; font-family:Cairo;';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function showError(msg) {
        document.getElementById('mainContainer').innerHTML = `<div style="padding:40px;text-align:center"><i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#dc3545"></i><p>${msg}</p><button class="back-btn" onclick="window.close()">إغلاق</button></div>`;
    }

    function openModal(imgSrc) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        if (imgSrc && imgSrc !== '#') {
            modal.style.display = 'flex';
            modalImg.src = imgSrc;
        } else {
            alert('لا توجد صورة لعرضها');
        }
    }
    window.closeModal = function() {
        document.getElementById('imageModal').style.display = 'none';
    };

function renderPage() {
    if (!productData) return;

    const fullFlyerUrl = getProductImageUrl(productData);
    const generalImageUrl = getGeneralFlyerUrl(productData);

    // عرض مؤقت تحميل في الجانب الأيمن
    const loadingHtml = `
        <div class="left-side">
            <div class="product-info">
                <div class="title-row">
                    <div class="supermarket-name"><i class="fas fa-store"></i> ${productData.supermarket}</div>
                    <div class="product-title">${productData.product}</div>
                </div>
                <div class="price-box">
                    <div><span class="current-price">${productData.currentPrice} ${productData.currency}</span><span class="original-price">${productData.originalPrice} ج.م</span></div>
                    <span class="discount-badge">-${productData._discount_pct}%</span>
                </div>
                <div class="actions-row">
                    <a href="#" class="btn btn-success"><i class="fas fa-phone-alt"></i> اتصل</a>
                    <a href="#" target="_blank" class="btn btn-primary"><i class="fas fa-globe"></i> الموقع الالكتروني</a>
                    <a href="#" target="_blank" class="btn btn-danger"><i class="fas fa-map"></i> الخريطة--</a>
                    <button onclick="shareProduct()" class="btn btn-warning"><i class="fas fa-share-alt"></i> مشاركة</button>
                    <button onclick="toggleFavorite()" class="btn btn-favorite" id="favoriteBtn"><i class="fas fa-heart"></i> تفضيل</button>
                </div>
                <div class="details-grid">
                    <div class="detail-item"><div class="detail-label">الاسم الأساسي</div><div class="detail-value">${productData.primaryName || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">الوحدة</div><div class="detail-value">${productData.unit || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">الفئة</div><div class="detail-value">${productData.category || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">العلامة التجارية</div><div class="detail-value">${productData.brand || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">ساري حتى</div><div class="detail-value">${productData.validUntil || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">تاريخ التحديث</div><div class="detail-value">${productData.updateDate ? new Date(productData.updateDate).toLocaleDateString('ar-EG') : '-'}</div></div>
                </div>
            </div>
            <div class="general-flyer" onclick="openModal('${generalImageUrl}')">
                <h4><i class="fas fa-info-circle"></i> الرئيسية</h4>
                ${generalImageUrl ? `<img src="${generalImageUrl}" alt="صفحة 1" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">` : '<i class="fas fa-image" style="font-size:3rem;color:#ccc"></i><p>لا توجد صورة عامة</p>'}
            </div>
            <button class="back-btn" onclick="window.close()"><i class="fas fa-arrow-right"></i> إغلاق</button>
        </div>
        <div class="right-side" id="croppedImageContainer" style="background: #1a1a2e; display: flex; justify-content: center; align-items: center; flex-direction: column; color: white;">
            <i class="fas fa-spinner fa-pulse" style="font-size: 3rem; margin-bottom: 15px;"></i>
            <p>جاري تحميل الصورة وتجهيزها...</p>
        </div>
    `;

    document.getElementById('mainContainer').innerHTML = loadingHtml;
    updateFavoriteButtonStatus();

    // --- بدء عملية القص ---
    cropImageWithCanvas(productData)
        .then(croppedDataUrl => {
            // عندما تنجح القص، نستبدل المحتوى بالصورة المقتطعة
            const container = document.getElementById('croppedImageContainer');
            if (container) {
                container.innerHTML = `
                    <img src="${croppedDataUrl}" alt="المنتج" style="max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3);">
                    <span style="position:absolute; bottom:15px; right:15px; background:rgba(0,0,0,0.6); color:#fff; padding:4px 12px; border-radius:20px; font-size:0.7rem; pointer-events:none;">
                        <i class="fas fa-crop-alt"></i> مقتصصة
                    </span>
                `;
                // إضافة حدث النقر لعرض الفلاير الكامل في المودال
                container.style.cursor = 'pointer';
                container.onclick = function() {
                    openModal(fullFlyerUrl);
                };
            }
        })
        .catch(error => {
            // في حال فشل القص (مشكلة في التحميل أو الإحداثيات)، نعرض الصورة الكاملة كحل احتياطي
            console.warn('فشل القص، نعرض الصورة الكاملة:', error);
            const container = document.getElementById('croppedImageContainer');
            if (container) {
                container.innerHTML = `
                    <img src="${fullFlyerUrl || 'https://via.placeholder.com/500?text=Image+Not+Found'}" alt="المنتج" style="max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3);" onerror="this.src='https://via.placeholder.com/500?text=Image+Not+Found'">
                    <span style="position:absolute; bottom:15px; right:15px; background:rgba(255,0,0,0.7); color:#fff; padding:4px 12px; border-radius:20px; font-size:0.7rem; pointer-events:none;">
                        <i class="fas fa-image"></i> كامل (بديل)
                    </span>
                `;
                container.style.cursor = 'pointer';
                container.onclick = function() {
                    openModal(fullFlyerUrl);
                };
            }
        });
}

    (async function init() {
        if (!loadProductFromSession()) return;
        await loadSupermarketData();
        renderPage();
    })();
</script>
