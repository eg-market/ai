name: Run Python OCR Script

on:
workflow_dispatch:

jobs:
run-script:
runs-on: ubuntu-latest
timeout-minutes: 360   # مهم لسكربت طويل (حتى 6 ساعات)

```
steps:
- name: Checkout repo
  uses: actions/checkout@v4

- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: "3.11"

- name: Install dependencies
  run: |
    pip install pandas openpyxl requests tqdm xlsxwriter

- name: Create output folder
  run: mkdir -p output

- name: Run script
  env:
    API_KEY: ${{ secrets.API_KEY }}
  run: |
    python script.py

- name: Upload Excel result
  uses: actions/upload-artifact@v4
  with:
    name: result-excel
    path: output/*.xlsx
```
