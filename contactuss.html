<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- Existing head content -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
<!-- Existing form HTML -->

<script>
// Enhanced Initialization with Error Logging
try {
emailjs.init("LgUkZLzt8N_NS-Bo6");
console.log("EmailJS initialized successfully");
} catch (error) {
console.error("EmailJS initialization error:", error);
alert("EmailJS Initialization Failed: " + error.message);
}

function sendEmail() {
const name = document.getElementById('name').value;
const email = document.getElementById('email').value;
const message = document.getElementById('message').value;

// Advanced Validation
if (!name) {
alert('الاسم مطلوب');
return;
}
if (!email || !email.includes('@')) {
alert('البريد الإلكتروني غير صحيح');
return;
}
if (!message) {
alert('الرسالة مطلوبة');
return;
}

const templateParams = {
from_name: name,
from_email: email,
to_email: 'wlid11@yahoo.com', // Verify this email
message: message
};

// Detailed Error Handling
emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
.then(
function(response) {
console.log('SUCCESS!', response);
document.getElementById('successMessage').style.display = 'block';
document.getElementById('errorMessage').style.display = 'none';

// Form Reset
document.getElementById('name').value = '';
document.getElementById('email').value = '';
document.getElementById('message').value = '';
},
function(error) {
console.error('SEND ERROR:', error);
document.getElementById('errorMessage').style.display = 'block';
document.getElementById('successMessage').style.display = 'none';

// Detailed Error Feedback
alert('خطأ في الإرسال. التفاصيل: ' + JSON.stringify(error));
}
);
}
</script>
</body>
</html>
