<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شجرة أقسام أمازون مصر – أفضل العروض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2b5a;--mute:#6573a0;--b1:#0a5bd3;--b2:#5a3fd6;--line:#d3ddf7;--deal:#12a874;--g:linear-gradient(120deg,#0a5bd3,#5a3fd6 65%,#8a3fd0);--sh:0 6px 20px #2846a01a}
*{box-sizing:border-box}html{color-scheme:light}
body{margin:0;background:linear-gradient(#eaf0ff,#f8faff 420px);color:var(--ink);font-family:Cairo,"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.6;min-height:100vh}
header{background:var(--g);color:#fff;padding:30px 20px 70px;position:relative;overflow:hidden}
header::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#ffffff1c;top:-210px;inset-inline-start:-90px}
header::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#ffc84a2e;bottom:-170px;inset-inline-end:8%}
.wrap{max-width:1560px;margin:0 auto;position:relative;z-index:1}
header h1{margin:0 0 4px;font-size:clamp(26px,4.4vw,42px);font-weight:800}
header p{margin:0;color:#dbe5ff;max-width:60ch}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.stat{background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:3px 16px;font-size:14px;backdrop-filter:blur(4px)}
.stat b{color:#ffd35c}
.up{margin-inline-start:auto;background:linear-gradient(#ffc233,#ff9900);color:#2b1a00;border:0;border-radius:999px;padding:8px 22px;font:700 14px Cairo,sans-serif;cursor:pointer;box-shadow:0 4px 14px #0003}
main{max-width:1560px;margin:-44px auto 60px;padding:0 16px;position:relative;z-index:2}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:22px}
.trail{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mute);margin-bottom:16px}
.trail a{color:var(--b1);font-weight:600;text-decoration:none}.trail a:hover{text-decoration:underline}.trail span{color:var(--ink);font-weight:700}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #ffb02e;outline-offset:2px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.head h2{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--b1)}
.head small{color:var(--mute);font-size:14px}
.back{background:#eef3ff;color:var(--b1);border-radius:999px;padding:6px 16px;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.back:hover{background:var(--b1);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{display:flex;gap:10px;align-items:center;background:#fff;color:var(--b1);border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;font-size:15px;text-decoration:none;transition:.18s}
.chip i{font-style:normal;font-size:12px;background:#eef3ff;color:var(--mute);border-radius:999px;padding:0 9px}
.chip:hover{background:var(--g);color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:var(--sh)}
.chip:hover i{background:#ffffff38;color:#fff}
.sec{font-size:16px;font-weight:700;margin:0 0 12px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;margin-bottom:22px}
.p{background:#fff;border-radius:18px;border:1px solid #e3eafb;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;position:relative;box-shadow:0 2px 10px #2846a010;transition:.2s}
.p:hover{box-shadow:0 14px 30px #2846a02e;transform:translateY(-4px)}
.im{aspect-ratio:1/.85;background:linear-gradient(#f6f8ff,#fff);display:flex;align-items:center;justify-content:center;padding:12px}
.p img{max-width:100%;max-height:100%;object-fit:contain}
.rk,.dc{position:absolute;top:10px;color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:0 11px}
.rk{inset-inline-start:10px;background:var(--g)}.dc{inset-inline-end:10px;background:linear-gradient(#25c795,#0f9f6e)}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.t{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.rt{font-size:13px;color:var(--mute)}.rt s{color:#f0a500;text-decoration:none;letter-spacing:1px}
.pr{display:flex;align-items:baseline;gap:8px;margin-top:auto}.pr strong{font-size:20px;color:var(--b1)}.pr .np{font-size:14px;color:var(--mute)}.pr small{color:var(--mute);text-decoration:line-through;font-size:13px}
.cp{font-size:12px;font-weight:700;color:#a35c00;background:#fff1d6;border-radius:999px;padding:1px 10px;align-self:flex-start}
.go{font-size:13px;font-weight:700;color:var(--b2)}
.more{display:flex;width:fit-content;margin:8px auto 4px;background:var(--g);color:#fff;border:0;border-radius:999px;padding:14px 34px;font:800 17px Cairo,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 22px #5a3fd650;transition:.2s}
.more:hover{transform:translateY(-3px);box-shadow:0 12px 28px #5a3fd666}
.tools{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:600;font-size:14px}
select{font:600 14px Cairo,sans-serif;border:2px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--b1);background:#fff}
.empty{padding:40px;text-align:center;color:var(--mute)}
.screen{animation:rv .25s ease-out}@keyframes rv{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}.t{font-size:13px}.pr strong{font-size:17px}.chip{padding:7px 13px;font-size:14px}}
.pager{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:10px 0 6px}
.pn,.pb{border-radius:999px;font-weight:800;font-size:15px;text-decoration:none;border:2px solid var(--line);color:var(--b1);background:#fff;transition:.15s}
.pn{min-width:42px;height:42px;display:grid;place-items:center}.pb{padding:9px 20px}
a.pn:hover,a.pb:hover{background:var(--g);color:#fff;border-color:transparent}
.pn.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 16px #5a3fd645}
.pb.off{opacity:.4}.gap{color:var(--mute);font-weight:800}.pc{text-align:center;color:var(--mute);font-size:13px;margin:0}
</style>
</head>
<body>
<header><div class="wrap">
<h1>تصفّح أقسام أمازون مصر</h1>
<p>اختر قسمًا لتظهر أقسامه الفرعية، وتحت كل مستوى أفضل المنتجات المرشّحة له من العروض والكوبونات.</p>
<div class="bar"><span class="stat"><b id="nP">0</b> منتج</span><span class="stat"><b id="nC">0</b> قسم</span>
</div>
</div></header>
<main><div class="card" id="app"><div class="empty">جارٍ تحميل المنتجات…</div></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let root,prev='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>{if(x==null)return 0;if(typeof x==='number')return x;const m=String(x).replace(/,/g,'').match(/\d+(\.\d+)?/);return m?+m[0]:0};
const fmt=n=>Math.round(n).toLocaleString('ar-EG');
const UNC='منتجات غير مصنّفة';
function norm(r){
  if(!r.asin||!String(r.asin).trim())return null;
  let path=[];for(let i=1;i<=10;i++){const v=r['breadcrumb_'+i];if(v&&String(v).trim())path.push(String(v).trim())}
  if(!path.length&&r.breadcrumb_full)path=String(r.breadcrumb_full).split('›').map(s=>s.trim()).filter(Boolean);
  if(!path.length)path=[UNC];
  const price=num(r.coupon_pay_price)||num(r.price_final_num)||num(r.price_num)||num(r.listing_price_num)||num(r.price)||num(r.original_price);
  let old=Math.max(num(r.price_original),num(r.original_price));if(!price||old<=price)old=0;
  let disc=old?Math.round((1-price/old)*100):Math.abs(num(r.discount_percent));
  const rating=num(r.rating_listing),rev=num(r.reviews_count),sales=num(r.sales_estimate);
  const img=String(r.images||'').split('|')[0].trim().replace(/\._[^/]*_\.(jpg|png|jpeg)/i,'._AC_UL320_.$1');
  return{path,price,old,disc,rating,rev,sales,img,cp:num(r.coupon_discount_percent),
    title:r.title||r.Title_from_file||'',url:'https://ishopping.fit/product/'+encodeURIComponent(String(r.asin).trim())+'.html',asin:r.asin,
    score:Math.log1p(sales)*3+Math.log1p(rev)*(rating||3)+(img?4:0)+Math.min(disc,70)/10+(price?3:0)};
}
function build(rows){
  const seen=new Set(),items=[];
  rows.forEach(r=>{const p=norm(r);if(p&&!seen.has(p.asin||p.title)){seen.add(p.asin||p.title);items.push(p)}});
  root={name:'',kids:new Map(),items:[]};let nodes=0;
  items.forEach(p=>{let n=root;n.items.push(p);p.path.forEach(seg=>{if(!n.kids.has(seg)){n.kids.set(seg,{name:seg,kids:new Map(),items:[]});nodes++}n=n.kids.get(seg);n.items.push(p)})});
  $('nP').textContent=fmt(items.length);$('nC').textContent=fmt(nodes);render();
}
function card(p,i,rk){
  const st=p.rating?'★'.repeat(Math.round(p.rating))+'☆'.repeat(5-Math.round(p.rating)):'';
  return `<a class="p" href="${esc(p.url)}" target="_blank" rel="noopener">${rk?`<span class="rk">#${i+1}</span>`:''}${p.disc>0?`<span class="dc">-${p.disc}%</span>`:''}
  <div class="im">${p.img?`<img loading="lazy" src="${esc(p.img)}" alt="">`:''}</div>
  <div class="bd"><div class="t">${esc(p.title)}</div>
  ${p.rating?`<div class="rt"><s>${st}</s> ${p.rating}${p.rev?` (${fmt(p.rev)})`:''}</div>`:''}
  ${p.cp?`<span class="cp">كوبون إضافي ${fmt(p.cp)}%</span>`:''}
  <div class="pr">${p.price?`<strong>${fmt(p.price)} جنيه</strong>${p.old?`<small>${fmt(p.old)}</small>`:''}`:'<strong class="np">السعر غير متاح حالياً</strong>'}</div><span class="go">عرض المنتج ←</span></div></a>`;
}

const href=(p,pg)=>'#c='+encodeURIComponent(p.join('›'))+(pg>1?'&p='+pg:'');
function parse(){const m=location.hash.slice(1).match(/^c=([^&]*)(?:&p=(\d+))?$/);if(!m)return{p:[],pg:1};let s='';try{s=decodeURIComponent(m[1])}catch(e){}return{p:s?s.split('›'):[],pg:+m[2]||1}}
function walk(p){let n=root;const ok=[];for(const s of p){if(!n.kids.has(s))break;n=n.kids.get(s);ok.push(s)}return{n,p:ok}}
function pick(n,shown,k=4){const s=[...n.items].sort((a,b)=>b.score-a.score);const out=s.filter(x=>!shown.has(x)).slice(0,k);for(const x of s){if(out.length>=k)break;if(!out.includes(x))out.push(x)}return out}
const PER=24;
function pager(p,pg,pages){
  if(pages<2)return'';
  const set=new Set([1,pages,pg-1,pg,pg+1]);if(pg<=3)[2,3,4].forEach(x=>set.add(x));if(pg>=pages-2)[pages-1,pages-2,pages-3].forEach(x=>set.add(x));
  const ns=[...set].filter(x=>x>=1&&x<=pages).sort((a,b)=>a-b);
  let h='<nav class="pager" aria-label="الصفحات">';
  h+=pg>1?`<a class="pb" href="${href(p,pg-1)}">→ الصفحة السابقة</a>`:'<span class="pb off">→ الصفحة السابقة</span>';
  let last=0;
  ns.forEach(x=>{if(x-last>1)h+='<span class="gap">…</span>';h+=x===pg?`<span class="pn on" aria-current="page">${fmt(x)}</span>`:`<a class="pn" href="${href(p,x)}">${fmt(x)}</a>`;last=x});
  h+=pg<pages?`<a class="pb" href="${href(p,pg+1)}">الصفحة التالية ←</a>`:'<span class="pb off">الصفحة التالية ←</span>';
  return h+`</nav><p class="pc">صفحة ${fmt(pg)} من ${fmt(pages)}</p>`;
}
function render(){
  const r=parse(),w=walk(r.p),p=w.p,n=w.n;
  if(!root.kids.size){$('app').innerHTML='<div class="empty">لا توجد بيانات صالحة. ارفع جدولًا يحتوي على أعمدة breadcrumb_1 … والسعر.</div>';return}
  const nm=p.length?p[p.length-1]:'كل الأقسام';
  let t='<a href="https://ishopping.fit/">الرئيسية</a> ‹ '+(p.length?'<a href="#c=">كل الأقسام</a>':'<span>كل الأقسام</span>');
  p.forEach((s,i)=>{t+=' ‹ '+(i===p.length-1?`<span>${esc(s)}</span>`:`<a href="${href(p.slice(0,i+1))}">${esc(s)}</a>`)});
  const shown=new Set();let cur=root,pk=pick(root,shown);pk.forEach(x=>shown.add(x));
  for(const s of p){cur=cur.kids.get(s);pk=pick(cur,shown);pk.forEach(x=>shown.add(x))}
  const rest=[...n.items].filter(x=>!pk.includes(x)).sort((a,b)=>b.score-a.score);
  const pages=Math.max(1,Math.ceil(rest.length/PER)),pg=Math.min(r.pg,pages);
  const kids=[...n.kids.values()].sort((a,b)=>(a.name===UNC)-(b.name===UNC)||b.items.length-a.items.length);
  const bk=p.length?`<a class="back" href="${href(p.slice(0,-1))}">→ رجوع</a>`:'';
  let h=`<div class="trail">${t}</div><div class="screen"><div class="head">${bk}<div><h2>${esc(nm)}</h2><small>${fmt(n.items.length)} منتج${kids.length?` • ${fmt(kids.length)} قسم فرعي`:''}</small></div></div>`;
  if(pg===1){
    if(kids.length)h+=`<p class="sec">اختر قسمًا فرعيًا</p><div class="chips">${kids.map(k=>`<a class="chip" href="${href(p.concat(k.name))}">${esc(k.name)}<i>${fmt(k.items.length)}</i></a>`).join('')}</div>`;
    h+=`<p class="sec">${p.length?`أفضل المنتجات في ${esc(nm)}`:'الأكثر رواجًا في كل الأقسام'}</p><div class="grid">${pk.map((x,i)=>card(x,i,1)).join('')}</div>`;
  }
  if(rest.length)h+=`<p class="sec">${pg===1?'بقية المنتجات':`منتجات ${esc(nm)}`} (${fmt(rest.length)})</p><div class="grid">${rest.slice((pg-1)*PER,pg*PER).map(x=>card(x)).join('')}</div>${pager(p,pg,pages)}`;
  $('app').innerHTML=h+'</div>';
}
const ys={};
function route(){if(!root)return;ys[prev]=window.scrollY;prev=location.hash;render();window.scrollTo(0,ys[prev]||0)}
window.addEventListener('hashchange',route);
const DATA_URL='https://raw.githubusercontent.com/eg-market/ai/main/amazon_products1.xlsx';
fetch(DATA_URL,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}).then(b=>{
  const wb=XLSX.read(b,{type:'array'});let rows=[];
  wb.SheetNames.forEach(s=>rows=rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:null})));
  prev=location.hash;build(rows);
}).catch(()=>{$('app').innerHTML='<div class="empty">تعذّر تحميل ملف المنتجات. تحقق من الاتصال ثم <a href="" onclick="location.reload();return false">أعد المحاولة</a>.</div>'});
</script>
</body>
</html>
